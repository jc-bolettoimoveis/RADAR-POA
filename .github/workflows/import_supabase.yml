name: Importar historico Radar para Supabase
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar cliente PostgreSQL
        run: python -m pip install 'psycopg2-binary==2.9.10'
      - name: Importar dados legados (sem apagar arquivos)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python scripts/import_legacy_supabase.py
