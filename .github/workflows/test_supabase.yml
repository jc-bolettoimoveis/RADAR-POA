name: Testar conexao Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar driver
        run: python -m pip install 'psycopg2-binary==2.9.10'
      - name: Validar conexao e tabelas sem modificar dados
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os,sys
          import psycopg2
          url=os.environ.get("DATABASE_URL")
          if not url:
              sys.exit("FALHA: secret SUPABASE_DATABASE_URL ausente ou vazio.")
          from urllib.parse import urlsplit, unquote
          try:
              parsed=urlsplit(url.strip())
              expected_user="postgres.wwvrrxeejnlbadbxehbi"
              expected_host="aws-1-sa-east-1.pooler.supabase.com"
              if parsed.username != expected_user:
                  sys.exit("DIAGNOSTICO: usuario diferente do projeto radar-boletto-br.")
              if parsed.hostname != expected_host or parsed.port != 5432 or parsed.path != "/postgres":
                  sys.exit("DIAGNOSTICO: host, porta ou banco diferente da URI oficial.")
              if parsed.password is None:
                  sys.exit("DIAGNOSTICO: URI sem senha.")
              if parsed.password.startswith("[") or parsed.password.endswith("]"):
                  sys.exit("DIAGNOSTICO: senha com colchetes. Remova os colchetes no Secret.")
              if parsed.password == "YOUR-PASSWORD":
                  sys.exit("DIAGNOSTICO: marcador YOUR-PASSWORD nao substituido.")
              if "@" in unquote(parsed.password) and "%40" not in parsed.password:
                  sys.exit("DIAGNOSTICO: senha com arroba sem codificacao percent-encode.")
              print("DIAGNOSTICO: estrutura da URI correta; testando autenticacao.")
          except ValueError:
              sys.exit("DIAGNOSTICO: URI malformada; confira caracteres especiais e porta.")
          try:
              with psycopg2.connect(url,connect_timeout=15,sslmode="require") as db:
                  with db.cursor() as cur:
                      cur.execute("select current_database(), count(*) from information_schema.tables where table_schema='radar_private'")
                      name, count=cur.fetchone()
                      if count < 4:
                          sys.exit("FALHA: tabelas do Radar nao encontradas.")
                      print("SUCESSO: conexao estabelecida, banco identificado e quatro tabelas encontradas.")
          except Exception as e:
              message=str(e).lower()
              if "password authentication failed" in message:
                  print("FALHA: autenticacao recusada. Confira usuario e senha.")
              elif "could not translate host name" in message or "name or service not known" in message:
                  print("FALHA: endereco do servidor invalido.")
              elif "timeout" in message or "connection refused" in message:
                  print("FALHA: servidor ou porta inacessivel.")
              else:
                  print("FALHA: URI ou conexao invalida. Verifique formato e credenciais.")
              sys.exit(1)
          PY
