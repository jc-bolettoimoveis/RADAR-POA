name: Testar conexao Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar driver
        run: python -m pip install 'psycopg2-binary==2.9.10'
      - name: Validar conexao e tabelas sem modificar dados
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os,sys
          import psycopg2
          url=os.environ.get("DATABASE_URL")
          if not url:
              sys.exit("FALHA: secret SUPABASE_DATABASE_URL ausente ou vazio.")
          try:
              with psycopg2.connect(url,connect_timeout=15,sslmode="require") as db:
                  with db.cursor() as cur:
                      cur.execute("select current_database(), count(*) from information_schema.tables where table_schema='radar_private'")
                      name, count=cur.fetchone()
                      if count < 4:
                          sys.exit("FALHA: tabelas do Radar nao encontradas.")
                      print("SUCESSO: conexao estabelecida, banco identificado e quatro tabelas encontradas.")
          except Exception as e:
              message=str(e).lower()
              if "password authentication failed" in message:
                  print("FALHA: autenticacao recusada. Confira usuario e senha.")
              elif "could not translate host name" in message or "name or service not known" in message:
                  print("FALHA: endereco do servidor invalido.")
              elif "timeout" in message or "connection refused" in message:
                  print("FALHA: servidor ou porta inacessivel.")
              else:
                  print("FALHA: URI ou conexao invalida. Verifique formato e credenciais.")
              sys.exit(1)
          PY
