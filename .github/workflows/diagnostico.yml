name: Diagnostico de sites (temporario)

on:
  push:
    branches: [correcao-coleta-imobiliarias]
    paths: [tools/diagnostico.py, .github/workflows/diagnostico.yml]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p diag && (timeout 2400 python tools/diagnostico.py > diag/log.txt 2>&1 || true) && tail -5 diag/log.txt
      - name: Salvar resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A diag || true
          git commit -m "diag: resultado [skip ci]" || true
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
